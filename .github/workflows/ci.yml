name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deterministic port checks etc. aside, nothing here needs a live Postgres pre-provisioned:
  # every integration/e2e test self-provisions one (see tests/common/mod.rs), so this
  # workflow needs no `services:` container and no manual setup step.
  RUST_LOG: warn
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache embedded Postgres binaries
        uses: actions/cache@v4
        with:
          # postgresql_embedded downloads a Postgres binary archive on first use and
          # caches it here; without this cache every job re-downloads it.
          path: ~/.theseus
          key: ${{ runner.os }}-theseus-postgres-v1

      # Style/lint checks are informational for now (the codebase predates a formatting/lint
      # pass) — they must not block CI on cosmetic issues, only tests and the build are
      # allowed to fail the job. Flip `continue-on-error` off once the codebase is clean.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo build (lib, bin, all examples)
        run: cargo build --workspace --all-targets

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test — unit tests (no DB)
        run: cargo test --lib --bins

      - name: cargo test — integration + e2e (self-provisioned Postgres, no container)
        timeout-minutes: 25
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          for t in pg_catalog pg_distributed pg_edge pg_numeric pg_pushdown e2e; do
            echo "=== cargo test --test $t ==="
            cargo test --test $t -- --test-threads=1 --nocapture
          done
