name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: "-C debuginfo=0"
  # On CI we use a containerized Postgres; locally tests self-provision via
  # postgresql_embedded when DATABASE_URL is unset (see tests/common/mod.rs).
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Style/lint checks are informational for now (the codebase predates a formatting/lint
      # pass) — they must not block CI on cosmetic issues, only tests and the build are
      # allowed to fail the job. Flip `continue-on-error` off once the codebase is clean.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo build (lib, bin, all examples)
        run: cargo build --workspace --all-targets

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test — unit tests (no DB)
        run: cargo test --lib --bins

      - name: cargo test — integration + e2e (containerized Postgres)
        timeout-minutes: 20
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d test
          for t in pg_catalog pg_distributed pg_edge pg_numeric pg_pushdown e2e; do
            echo "=== cargo test --test $t ==="
            cargo test --test $t -- --test-threads=1 --nocapture
          done
