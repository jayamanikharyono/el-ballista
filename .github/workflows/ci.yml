name: CI

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: "-C debuginfo=0"
  # Incremental caches are useless on a fresh runner and cost gigabytes of disk.
  CARGO_INCREMENTAL: 0
  # Both databases come from the compose stack (tests/docker/compose.yaml: Postgres 17 + MySQL 8,
  # seeded from tests/data) — the same stack developers run locally. These are the harness
  # defaults, spelled out so the job is explicit about what it connects to.
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test
  MYSQL_URL: mysql://root:password@127.0.0.1:3306/test

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # The runner's root disk starts with only ~14 GB free. A debug build of every target
      # (lib, bin, examples, one binary per tests/*.rs) plus clippy's artifacts gets close to
      # that, and when the disk fills the linker dies with `signal 7 [Bus error]`.
      # Drop preinstalled SDKs this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caches ~/.cargo and target/ keyed on the toolchain and Cargo.lock, and prunes stale
      # artifacts before saving. (A plain actions/cache of target/ with a prefix restore key kept
      # every old artifact forever: after the crate rename it restored the old-name build next to
      # the new one and filled the disk.)
      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      # Blocking gates: formatting and lints must be clean.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build (lib, bin, all examples)
        run: cargo build --workspace --all-targets

      - name: cargo test — unit tests (no DB)
        run: cargo test --lib --bins

      - name: cargo test — doc tests (no DB)
        run: cargo test --doc

      # Start + seed both engines; `--wait` returns only once both healthchecks pass (they use
      # TCP, which only answers after the init/seed scripts have finished).
      - name: Start test databases (compose)
        timeout-minutes: 10
        run: docker compose -f tests/docker/compose.yaml up -d --wait

      # Every integration test file (tests/*.rs), serially: the fixtures share one server each.
      - name: cargo test — all integration tests (compose stack)
        timeout-minutes: 40
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --tests -- --test-threads=1

      - name: Database logs (on failure)
        if: failure()
        run: docker compose -f tests/docker/compose.yaml logs --no-color --tail=200

      - name: Disk usage (on failure)
        if: failure()
        run: |
          df -h /
          du -sh target ~/.cargo 2>/dev/null || true

      - name: Tear down test databases
        if: always()
        run: docker compose -f tests/docker/compose.yaml down -v
