[package]
name = "rust-ballista-extraction-layer"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_ballista_extraction_layer"
path = "src/lib.rs"

[[bin]]
name = "rust-ballista-extraction-layer"
path = "src/main.rs"

[dependencies]
arrow = "58.4"
ballista = "54.1.0"
ballista-core = "54.1.0"
ballista-executor = { version = "54.1.0", default-features = false, features = ["arrow-ipc-optimizations"] }
ballista-scheduler = { version = "54.1.0", default-features = false, features = ["rest-api", "tracing"] }
bigdecimal = "0.4.10"
chrono = { version = "0.4.45", features = ["serde"] }
datafusion = "54.1.0"
datafusion-proto = "54.1.0"
log = "0.4.34"
fern = "0.7"
once_cell = "1.20"
parquet = "58.4"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "chrono", "bigdecimal", "json", "uuid"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
futures = "0.3.34"
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
async-stream = "0.3"

[[example]]
name = "incremental_extraction"
path = "examples/incremental_extraction.rs"

[[example]]
name = "end_to_end"
path = "examples/end_to_end.rs"

[[example]]
name = "full_extraction"
path = "examples/full_extraction.rs"

[[example]]
name = "daily_incremental"
path = "examples/daily_incremental.rs"

[[example]]
name = "hourly_incremental"
path = "examples/hourly_incremental.rs"

[[example]]
name = "parallel_extraction"
path = "examples/parallel_extraction.rs"

[[example]]
name = "distributed_extraction"
path = "examples/distributed_extraction.rs"

[[example]]
name = "dataframe_extraction"
path = "examples/dataframe_extraction.rs"

[[example]]
name = "bench_full_load"
path = "examples/bench_full_load.rs"

[[example]]
name = "pipeline_extraction"
path = "examples/pipeline_extraction.rs"

[dev-dependencies]
# Integration/e2e tests run against the Docker compose stack
# (tests/docker/compose.yaml); no test-only dependencies.
