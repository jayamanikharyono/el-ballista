# Local test databases for integration/e2e — the single source of truth for a live DB.
# Both engines are seeded from ONE dataset: the dvdrental dump under tests/data/dvdrental.
#   * Postgres restores it natively (pg_restore) from the .dat files.
#   * MySQL loads the SAME .dat files via tests/data/dvdrental_mysql.sql (generated by
#     tests/docker/gen_mysql_seed.py) — identical tables, columns, and rows.
# So correctness can be checked by querying either engine directly and via either connector.
#
#   docker compose -f tests/docker/compose.yaml up -d --wait     # start + seed, wait until data is loaded
#   cargo test --all -- --test-threads=1
#   docker compose -f tests/docker/compose.yaml down -v
#
# Mirrors the CI job (.github/workflows/ci.yml). Requires `docker compose`.
# Data is on tmpfs — ephemeral, re-seeded fresh on every `up`. Note: the .dat files must be
# readable by the container's db user; a normal git checkout (mode 644) and Docker Desktop file
# sharing both satisfy this.
name: el-ballista-test
services:
  postgres:
    image: postgres:17
    # Hardcoded budget: a 2-CPU quota + 2g RAM (a quota, not a pin — benchmark/run.sh
    # pins its own bench-pg container to cores 4-7 + 2g; this compose service is not it).
    # A shared fixture must never change shape between runs.
    #cpuset: '4-5' enable when benchmark
    cpus: 2
    mem_limit: 2g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../data/dvdrental:/dvdrental:ro
      - ./pg-init.sh:/docker-entrypoint-initdb.d/10-dvdrental.sh:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check, which only succeeds after init (seed) completes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d test"]
      interval: 2s
      timeout: 3s
      retries: 90
  mysql:
    image: mysql:8.0
    #cpuset: '4-5' enable when benchmark
    cpus: 2
    mem_limit: 2g
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: test
    ports:
      - "3306:3306"
    command:
      - "--secure-file-priv="
      - "--local-infile=ON"
      - "--default-authentication-plugin=mysql_native_password"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../data/dvdrental:/dvdrental:ro
      - ./mysql-prep.sh:/docker-entrypoint-initdb.d/05-dvdrental-prep.sh:ro
      - ../data/dvdrental_mysql.sql:/docker-entrypoint-initdb.d/10-dvdrental.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 3s
      timeout: 3s
      retries: 90
